name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check build.zig src test
      - name: Build
        run: zig build
      - name: Test
        run: zig build test --summary all
      - name: Bench binary builds
        run: zig build bench

  # The two real-ecosystem acceptance gates. They are *scripted* checks rather
  # than `zig build test` conformance cases because their corpora — the real
  # published `@types/node` / `@types/react` .d.ts — are large and gitignored,
  # so they have to be fetched. Both compare ztsc's user-code diagnostics
  # against a committed snapshot AND, when the pinned baseline is installed,
  # re-run the native tsgo 7.0.2 oracle live and diff against that too.
  #
  # Failure semantics are deliberately strict: neither the fetch nor the gates
  # may be soft-failed. `run.sh` exits 2 when the corpus (or the binary) is
  # missing, which is a *failure*, not a skip — a gate that cannot run is not a
  # gate that passed. The corpus and the baseline are therefore verified
  # explicitly before the gates run, so a partially-successful `npm pack` sweep
  # (fetch_real.sh logs and continues past a package it could not download)
  # cannot silently degrade the run into a weaker check.
  #
  # Network flakiness is absorbed by caching, not by ignoring errors: the
  # vendored corpus and the baseline's node_modules are cached on the pinned
  # versions, so the steady state needs no registry access at all, and the
  # fetch steps retry before giving up.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keyed on the pinned package list / lockfile, so a version bump in
      # either file invalidates its cache and re-fetches.
      - name: Cache vendored real corpus
        id: cache-corpus
        uses: actions/cache@v4
        with:
          path: bench/corpus/real
          key: real-corpus-${{ hashFiles('bench/fetch_real.sh') }}
      - name: Cache tsgo baseline
        id: cache-tsgo
        uses: actions/cache@v4
        with:
          path: bench/baselines/tsgo/node_modules
          key: tsgo-baseline-${{ hashFiles('bench/baselines/tsgo/package-lock.json') }}

      - name: Fetch real corpus
        if: steps.cache-corpus.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            bench/fetch_real.sh && exit 0
            echo "fetch_real.sh attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1
      - name: Install tsgo baseline
        if: steps.cache-tsgo.outputs.cache-hit != 'true'
        working-directory: bench/baselines/tsgo
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $attempt failed; retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

      # Fail loudly and specifically if anything the gates depend on is absent.
      # Without this the gates would still fail (exit 2), but the reason would
      # be buried; and the tsgo check below is what keeps the live-differential
      # leg from silently downgrading to "trust the committed snapshot".
      - name: Verify gate inputs are present
        run: |
          set -euo pipefail
          fail=0
          for d in _types_node_22.7.4 _types_react_18.3.11 csstype_3.1.3 \
                   _types_prop-types_15.7.13; do
            if [ ! -e "bench/corpus/real/$d/package.json" ]; then
              echo "missing vendored package: bench/corpus/real/$d" >&2
              fail=1
            fi
          done
          tsgo="bench/baselines/tsgo/node_modules/@typescript/typescript-linux-x64/lib/tsc"
          if [ ! -x "$tsgo" ]; then
            echo "missing tsgo baseline binary: $tsgo" >&2
            fail=1
          else
            ver="$("$tsgo" --version | awk '{print $2}')"
            [ "$ver" = "7.0.2" ] || { echo "tsgo is $ver, want 7.0.2" >&2; fail=1; }
          fi
          [ "$fail" = 0 ] || {
            echo "acceptance gate inputs unavailable — failing rather than skipping" >&2
            exit 1
          }

      - name: Build bench binary
        run: zig build bench
      - name: Real @types/node acceptance gate
        run: test/node_accept_real/run.sh
      - name: Real @types/react acceptance gate
        run: test/react_accept_real/run.sh
